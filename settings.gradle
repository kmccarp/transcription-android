pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'transcription-android'

include ':core'

// Allow developers without an Android SDK to work on :core in isolation:
//   ./gradlew :core:test -PskipApp
// CI always builds :app. See README.
if (!startParameter.projectProperties.containsKey('skipApp')) {
    include ':app'
}
