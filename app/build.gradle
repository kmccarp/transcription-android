plugins {
    id 'com.android.application' version '8.7.3'
    id 'jacoco'
}

android {
    namespace   'com.transcription.app'
    compileSdk  34

    defaultConfig {
        applicationId   'com.transcription.app'
        minSdk          24
        targetSdk       34
        versionCode     1
        versionName     '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = false
        buildConfig = false
    }

    buildTypes {
        debug {
            testCoverageEnabled true
            // Cleartext for http://10.0.2.2 (the emulator's loopback to host
            // running Ollama). Production traffic is opt-in via settings.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.withType(Test).configureEach {
    useJUnit()
    finalizedBy 'jacocoTestReport'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*',
            '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*'
    ]
    def debugTree = fileTree(dir: "$buildDir/intermediates/javac/debug/classes",
            excludes: fileFilter)
    def mainSrc = "$projectDir/src/main/java"
    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: buildDir,
            includes: ['**/jacoco/testDebugUnitTest.exec']))
}
