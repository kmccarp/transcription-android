plugins {
    id 'com.android.application' version '8.7.3'
    id 'jacoco'
}

android {
    namespace   'com.transcription.app'
    compileSdk  34

    defaultConfig {
        applicationId   'com.transcription.app'
        minSdk          24
        targetSdk       34
        versionCode     1
        versionName     '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = false
        buildConfig = false
    }

    buildTypes {
        debug {
            testCoverageEnabled true
            // Cleartext for http://10.0.2.2 (the emulator's loopback to host
            // running Ollama). Production traffic is opt-in via settings.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                useJUnit()
                // Robolectric on JDK 17+ needs the deep-reflection escape hatches.
                jvmArgs(
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.net=ALL-UNNAMED',
                        '--add-opens=java.base/java.nio=ALL-UNNAMED',
                        '--add-opens=java.base/java.text=ALL-UNNAMED',
                        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
                )
            }
        }
    }

    // Disable lintVital* on release; we don't ship signed APKs from CI yet.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

jacoco {
    toolVersion = '0.8.12'
}

// JaCoCo for the Android module is a "best effort" report — we don't fail
// the build on coverage here (the contract lives in :core). We point at the
// AGP-managed exec file and the compiled debug classes, but tolerate missing
// inputs so a clean build still produces something useful.
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*',
            '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*'
    ]
    sourceDirectories.setFrom(files(["$projectDir/src/main/java"]))
    classDirectories.setFrom(fileTree(layout.buildDirectory) {
        include '**/intermediates/javac/debug/**/classes/**'
        exclude fileFilter
    })
    executionData.setFrom(fileTree(layout.buildDirectory) {
        include '**/jacoco/testDebugUnitTest.exec'
    })
}
